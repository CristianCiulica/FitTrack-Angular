# Tine treaz backend-ul de pe Render (planul gratuit adoarme dupa ~15 min de
# inactivitate, iar pornirea la rece dureaza 20-50s si strica prima vizita).
# Nota: GitHub dezactiveaza cron-urile daca repo-ul nu are activitate 60 de zile;
# se reactiveaza din tab-ul Actions.
name: Keep Render backend awake

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        run: |
          curl -sS --max-time 70 https://fittrack-angular.onrender.com/api/health || true
