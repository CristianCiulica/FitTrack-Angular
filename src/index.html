<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>FitTrack</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <script>
    // Apply before styles and Angular load so a saved dark appearance never flashes white.
    (function () {
      var choice = 'system';
      try { choice = localStorage.getItem('fittrack_theme') || 'system'; } catch (_) {}
      var dark = choice === 'dark' || (choice !== 'light' && choice !== 'dark' && window.matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
      document.documentElement.style.backgroundColor = dark ? '#0b0c0f' : '#ffffff';
      document.querySelector('meta[name="theme-color"]').content = dark ? '#0b0c0f' : '#ffffff';
    })();
  </script>
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="FitTrack">
  <meta name="application-name" content="FitTrack">
  <meta name="description" content="Track workouts, runs, nutrition and progress with FitTrack.">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" href="icons/icon-72x72.png">
</head>
<body>
  <style>
    #app-startup { position: fixed; inset: 0; z-index: 10000; display: grid; place-items: center; padding: 24px; background: #f5f5f7; color: #1d1d1f; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; text-align: center; }
    html[data-theme="dark"] #app-startup { background: #0b0c0f; color: #f5f5f7; }
    #app-startup .startup-brand { font-size: 30px; font-weight: 700; letter-spacing: -1px; }
    #app-startup .startup-brand span { color: #0071e3; }
    #app-startup p { max-width: 280px; margin: 16px auto; font-size: 15px; line-height: 1.5; opacity: .75; }
    #app-startup button { border: 0; border-radius: 24px; padding: 12px 22px; background: #0071e3; color: white; font: inherit; cursor: pointer; }
    #app-startup [hidden] { display: none !important; }
  </style>
  <div id="app-startup" role="status" aria-live="polite">
    <div>
      <div class="startup-brand">FitTrack<span>.</span></div>
      <p id="startup-message">Getting things ready…</p>
      <button id="startup-retry" type="button" hidden>Try again</button>
      <noscript><p>Enable JavaScript to use FitTrack.</p></noscript>
    </div>
  </div>
  <script>
    (function () {
      var screen = document.getElementById('app-startup');
      var message = document.getElementById('startup-message');
      var retry = document.getElementById('startup-retry');
      function recover() {
        message.textContent = 'Taking longer than expected. Check your connection and try again.';
        retry.hidden = false;
      }
      var timer = setTimeout(recover, 12000);
      function ready() {
        clearTimeout(timer);
        screen.remove();
        document.removeEventListener('fittrack:ready', ready);
        document.removeEventListener('fittrack:startup-error', recover);
      }
      document.addEventListener('fittrack:ready', ready);
      document.addEventListener('fittrack:startup-error', recover);
      retry.addEventListener('click', function () {
        // Fetch a fresh shell without deleting auth, workout drafts or saved data.
        var url = new URL(window.location.href);
        url.searchParams.set('ngsw-bypass', 'true');
        window.location.replace(url.toString());
      });
    })();
  </script>
  <app-root></app-root>
  <script src="firebase-config.js"></script>
</body>
</html>
