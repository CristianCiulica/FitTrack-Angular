<nz-layout class="app-layout">
  <!-- Sidebar -->
  <nz-sider
    [nzWidth]="208"
    class="sidebar"
  >
    <div class="sidebar-logo">
      <span nz-icon nzType="fire" style="font-size: 24px; color: #1890ff; margin-right: 8px;"></span>
      <span class="logo-text">FitTrack</span>
    </div>
    <ul nz-menu nzMode="inline" class="sidebar-menu">
      <li nz-menu-item routerLinkActive="ant-menu-item-selected">
        <a routerLink="/dashboard" aria-label="Dashboard">
          <span nz-icon nzType="dashboard"></span>
          <span>Home</span>
        </a>
      </li>
      <li nz-menu-item routerLinkActive="ant-menu-item-selected">
        <a routerLink="/workouts" aria-label="Workouts">
          <span nz-icon nzType="thunderbolt"></span>
          <span>History</span>
        </a>
      </li>
      <li nz-menu-item routerLinkActive="ant-menu-item-selected">
        <a routerLink="/start-workout" aria-label="Start workout">
          <span nz-icon nzType="play-circle"></span>
          <span>Workout</span>
        </a>
      </li>
      <li nz-menu-item routerLinkActive="ant-menu-item-selected">
        <a routerLink="/running" aria-label="Running">
          <span nz-icon nzType="rise"></span>
          <span>Run</span>
        </a>
      </li>
      <li nz-menu-item routerLinkActive="ant-menu-item-selected">
        <a routerLink="/bmi" aria-label="BMI calculator">
          <span nz-icon nzType="heart"></span>
          <span>BMI</span>
        </a>
      </li>
    </ul>

    <div class="sidebar-footer">
      <div class="user-info">
        <nz-avatar nzIcon="user" style="background: #1d1d1f"></nz-avatar>
        <span class="user-name">{{ userName() }}</span>
      </div>
      <button nz-button nzType="text" nzDanger class="logout-button" (click)="logout()">Logout</button>
    </div>
  </nz-sider>

  <nz-layout class="main-layout">
    <nz-header class="app-header">
      <h2>BMI Calculator</h2>
      <div class="header-actions">
        <button nz-button nzDanger class="logout-button" (click)="logout()">Logout</button>
      </div>
    </nz-header>

    <nz-content class="app-content">
      <div class="container">
        <nz-card class="bmi-card" nzTitle="Calculate your Body Mass Index">

          <div class="calc-row">
            <label>Height (cm)</label>
            <nz-input-number
              [(ngModel)]="height"
              [nzMin]="50"
              [nzMax]="250"
              [nzStep]="1"
              style="width: 100%;">
            </nz-input-number>
          </div>

          <div class="calc-row">
            <label>Weight (kg)</label>
            <nz-input-number
              [(ngModel)]="weight"
              [nzMin]="20"
              [nzMax]="300"
              [nzStep]="1"
              style="width: 100%;">
            </nz-input-number>
          </div>

          <div class="result-box">
            <h3>BMI Result</h3>
            <div class="bmi-value">{{ bmi() }}</div>
            <nz-tag [nzColor]="bmiCategory().color">{{ bmiCategory().text }}</nz-tag>
          </div>

        </nz-card>
      </div>
    </nz-content>
  </nz-layout>
</nz-layout>
