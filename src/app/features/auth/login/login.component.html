<main class="access-page">
  <div class="track-photo" role="img" aria-label="FitTrack">
    <span class="track-wordmark" aria-hidden="true">FitTrack<span>.</span></span>
  </div>
  <section class="access-panel" aria-labelledby="access-title">
    <div class="access-form">
      <header class="access-heading">
        <h1 id="access-title">Welcome back</h1>
        <p>Sign in to your training log.</p>
      </header>
      <form nz-form [formGroup]="form" (ngSubmit)="submit()" class="auth-form">
        <div class="form-group">
          <label for="login-email">Email</label>
          <nz-form-item>
            <nz-form-control [nzErrorTip]="emailError">
              <input nz-input formControlName="email" id="login-email" autocomplete="email" placeholder="you@example.com" type="email" class="auth-input" />
              <ng-template #emailError>Enter a valid email.</ng-template>
            </nz-form-control>
          </nz-form-item>
        </div>

        <div class="form-group">
          <div class="label-row">
            <label for="login-password">Password</label>
            <button type="button" (click)="forgotPassword()" class="forgot-link">Forgot password?</button>
          </div>
          <nz-form-item>
            <nz-form-control [nzErrorTip]="passError">
              <div class="input-wrapper">
                <input nz-input formControlName="password" id="login-password" autocomplete="current-password" placeholder="••••••••"
                  [type]="passwordVisible ? 'text' : 'password'" class="auth-input" />
                <button
                  type="button"
                  class="eye-btn"
                  [attr.aria-label]="passwordVisible ? 'Hide password' : 'Show password'"
                  [attr.aria-pressed]="passwordVisible"
                  (click)="togglePasswordVisibility()"
                >
                  <span nz-icon [nzType]="passwordVisible ? 'eye-invisible' : 'eye'"></span>
                </button>
              </div>
              <ng-template #passError>Password is required.</ng-template>
            </nz-form-control>
          </nz-form-item>
        </div>

        <label nz-checkbox formControlName="remember" class="remember-row">
          Remember me
        </label>

        <ft-action [busy]="loading" kind="submit" variant="filled" class="auth-primary">
          {{ loading ? 'Signing in…' : 'Sign in' }}
        </ft-action>

        <div class="divider">
          <span>or</span>
        </div>

        <ft-action
          class="auth-google"
          [busy]="googleLoading"
          (activated)="signInWithGoogle()"
        >
          <span class="google-icon" aria-hidden="true">
            <svg width="18" height="18" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M44.5 20H24V28.5H35.7C34.2 33.4 29.8 36.5 24 36.5C17.1 36.5 11.5 30.9 11.5 24C11.5 17.1 17.1 11.5 24 11.5C27 11.5 29.8 12.6 31.9 14.4L37.9 8.4C34.2 5 29.3 3 24 3C12.4 3 3 12.4 3 24C3 35.6 12.4 45 24 45C35.6 45 45 35.6 45 24C45 22.6 44.8 21.3 44.5 20Z" fill="#4285F4"/>
              <path d="M6.3 14.7L12.9 19.5C14.7 15 18.9 11.5 24 11.5C27 11.5 29.8 12.6 31.9 14.4L37.9 8.4C34.2 5 29.3 3 24 3C16 3 9 7.6 6.3 14.7Z" fill="#34A853"/>
              <path d="M24 45C29.7 45 34.6 43.1 38.2 39.8L31.6 34.7C29.7 36 27 36.5 24 36.5C18.2 36.5 13.8 33.4 12.2 28.5L5.5 33.7C8.2 40.6 15.5 45 24 45Z" fill="#FBBC05"/>
              <path d="M12.2 28.5C11.8 27.4 11.5 26.3 11.5 24C11.5 21.7 11.8 20.6 12.2 19.5L5.5 14.7C4 17.6 3 20.7 3 24C3 27.3 4 30.4 5.5 33.3L12.2 28.5Z" fill="#EA4335"/>
            </svg>
          </span>
          Continue with Google
        </ft-action>
      </form>
      <p class="access-footer">New to FitTrack? <a routerLink="/auth/register">Create an account</a></p>
    </div>
  </section>
</main>
