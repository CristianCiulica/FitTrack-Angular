<main class="access-page">
  <div class="track-photo" role="img" aria-label="FitTrack">
    <span class="track-wordmark" aria-hidden="true">FitTrack<span>.</span></span>
  </div>
  <section class="access-panel" aria-labelledby="access-title">
    <div class="access-form">
      <header class="access-heading">
        <h1 id="access-title">Create an account</h1>
      </header>
      <form nz-form [formGroup]="form" (ngSubmit)="submit()" class="auth-form">
        <div class="form-row">
          <div class="form-group">
            <label for="register-firstName">First name</label>
            <nz-form-item>
              <nz-form-control nzErrorTip="Required.">
                <input nz-input formControlName="firstName" id="register-firstName" autocomplete="given-name" class="auth-input" />
              </nz-form-control>
            </nz-form-item>
          </div>
          <div class="form-group">
            <label for="register-lastName">Last name</label>
            <nz-form-item>
              <nz-form-control nzErrorTip="Required.">
                <input nz-input formControlName="lastName" id="register-lastName" autocomplete="family-name" class="auth-input" />
              </nz-form-control>
            </nz-form-item>
          </div>
        </div>

        <div class="form-group">
          <label for="register-email">Email</label>
          <nz-form-item>
            <nz-form-control nzErrorTip="Enter a valid email.">
              <input nz-input formControlName="email" id="register-email" autocomplete="email" placeholder="you@example.com" type="email" class="auth-input" />
            </nz-form-control>
          </nz-form-item>
        </div>

        <div class="form-group">
          <label for="register-password">Password</label>
          <nz-form-item>
            <nz-form-control nzErrorTip="Use at least 6 characters with upper and lowercase letters, a number and a symbol.">
              <div class="input-wrapper">
                <input nz-input formControlName="password" id="register-password" aria-describedby="password-rules" autocomplete="new-password" placeholder="••••••••"
                  [type]="passwordVisible ? 'text' : 'password'" class="auth-input" />
                <button type="button" class="eye-btn" [attr.aria-label]="passwordVisible ? 'Hide password' : 'Show password'" [attr.aria-pressed]="passwordVisible" (click)="passwordVisible = !passwordVisible">
                  <span nz-icon [nzType]="passwordVisible ? 'eye-invisible' : 'eye'"></span>
                </button>
              </div>
            </nz-form-control>
          </nz-form-item>
        </div>

        <p class="field-hint" id="password-rules">Use at least 6 characters with a capital letter, a lowercase letter, a number and a symbol.</p>
        <div class="form-group">
          <label for="register-confirmPassword">Confirm password</label>
          <nz-form-item>
            <nz-form-control
              [nzValidateStatus]="showPasswordMismatch ? 'error' : form.controls['confirmPassword']"
              [nzErrorTip]="showPasswordMismatch ? 'Passwords do not match.' : 'Required.'"
            >
              <div class="input-wrapper">
                <input
                  nz-input
                  formControlName="confirmPassword" id="register-confirmPassword" autocomplete="new-password"
                  placeholder="••••••••"
                  [type]="confirmPasswordVisible ? 'text' : 'password'"
                  class="auth-input"
                />
                <button
                  type="button"
                  class="eye-btn"
                  [attr.aria-label]="confirmPasswordVisible ? 'Hide confirmed password' : 'Show confirmed password'"
                  [attr.aria-pressed]="confirmPasswordVisible"
                  (click)="toggleConfirmPasswordVisibility()"
                >
                  <span nz-icon [nzType]="confirmPasswordVisible ? 'eye-invisible' : 'eye'"></span>
                </button>
              </div>
            </nz-form-control>
          </nz-form-item>
        </div>

        <ft-action [busy]="loading" [disabled]="providerBusy" kind="submit" variant="filled" class="auth-primary">
          {{ loading ? 'Creating account…' : 'Create account' }}
        </ft-action>

        <div class="divider">
          <span>or continue with</span>
        </div>

        <app-auth-providers [disabled]="loading" (busyChange)="providerBusy = $event" />
      </form>
      <p class="access-footer">Already have an account? <a routerLink="/auth/login">Sign in</a></p>
    </div>
  </section>
</main>
