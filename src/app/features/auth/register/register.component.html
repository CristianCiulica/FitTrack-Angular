<div class="auth-wrapper">
  <div class="auth-left">
    <div class="auth-brand">
      <span class="brand-logo" aria-label="FitTrack">FitTrack<span class="brand-dot">.</span></span>
    </div>
    <div class="auth-hero">
      <h1>Build better<br>habits,<br>one workout<br>at a time.</h1>
      <p>Create your account and keep every workout, run and nutrition goal in one place.</p>
    </div>
  </div>

  <div class="auth-right">
    <div class="mobile-brand">
      <span class="brand-logo" aria-label="FitTrack">FitTrack<span class="brand-dot">.</span></span>
      <small>Train. Track. Progress.</small>
    </div>
    <div class="auth-card">
      <div class="card-header">
        <h2>Create account</h2>
        <p>Start tracking your workouts today</p>
      </div>

      <form nz-form [formGroup]="form" (ngSubmit)="submit()" class="auth-form">
        <div class="form-row">
          <div class="form-group">
            <label>First name</label>
            <nz-form-item>
              <nz-form-control nzErrorTip="Required.">
                <input nz-input formControlName="firstName" placeholder="John" class="apple-input" />
              </nz-form-control>
            </nz-form-item>
          </div>
          <div class="form-group">
            <label>Last name</label>
            <nz-form-item>
              <nz-form-control nzErrorTip="Required.">
                <input nz-input formControlName="lastName" placeholder="Doe" class="apple-input" />
              </nz-form-control>
            </nz-form-item>
          </div>
        </div>

        <div class="form-group">
          <label>Email</label>
          <nz-form-item>
            <nz-form-control nzErrorTip="Enter a valid email.">
              <input nz-input formControlName="email" placeholder="you@example.com" type="email" class="apple-input" />
            </nz-form-control>
          </nz-form-item>
        </div>

        <div class="form-group">
          <label>Password</label>
          <nz-form-item>
            <nz-form-control nzErrorTip="Min. 6 chars: upper, lower, number, special.">
              <div class="input-wrapper">
                <input nz-input formControlName="password" placeholder="••••••••"
                  [type]="passwordVisible ? 'text' : 'password'" class="apple-input" />
                <button type="button" class="eye-btn" (click)="passwordVisible = !passwordVisible">
                  <span nz-icon [nzType]="passwordVisible ? 'eye-invisible' : 'eye'"></span>
                </button>
              </div>
            </nz-form-control>
          </nz-form-item>
        </div>

        <div class="form-group">
          <label>Confirm password</label>
          <nz-form-item>
            <nz-form-control [nzErrorTip]="form.hasError('passwordMismatch') ? 'Passwords do not match.' : 'Required.'">
              <div class="input-wrapper">
                <input
                  nz-input
                  formControlName="confirmPassword"
                  placeholder="••••••••"
                  [type]="confirmPasswordVisible ? 'text' : 'password'"
                  class="apple-input"
                />
                <button
                  type="button"
                  class="eye-btn"
                  [attr.aria-label]="confirmPasswordVisible ? 'Hide confirmed password' : 'Show confirmed password'"
                  [attr.aria-pressed]="confirmPasswordVisible"
                  (click)="toggleConfirmPasswordVisibility()"
                >
                  <span nz-icon [nzType]="confirmPasswordVisible ? 'eye-invisible' : 'eye'"></span>
                </button>
              </div>
            </nz-form-control>
          </nz-form-item>
        </div>

        <button nz-button nzType="primary" nzBlock [nzLoading]="loading" type="submit" class="submit-btn">
          Create account
        </button>

        <div class="divider">
          <span>or</span>
        </div>

        <button
          nz-button
          nzBlock
          type="button"
          class="google-btn"
          [nzLoading]="googleLoading"
          (click)="signInWithGoogle()"
        >
          <span class="google-icon" aria-hidden="true">
            <svg width="18" height="18" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M44.5 20H24V28.5H35.7C34.2 33.4 29.8 36.5 24 36.5C17.1 36.5 11.5 30.9 11.5 24C11.5 17.1 17.1 11.5 24 11.5C27 11.5 29.8 12.6 31.9 14.4L37.9 8.4C34.2 5 29.3 3 24 3C12.4 3 3 12.4 3 24C3 35.6 12.4 45 24 45C35.6 45 45 35.6 45 24C45 22.6 44.8 21.3 44.5 20Z" fill="#4285F4"/>
              <path d="M6.3 14.7L12.9 19.5C14.7 15 18.9 11.5 24 11.5C27 11.5 29.8 12.6 31.9 14.4L37.9 8.4C34.2 5 29.3 3 24 3C16 3 9 7.6 6.3 14.7Z" fill="#34A853"/>
              <path d="M24 45C29.7 45 34.6 43.1 38.2 39.8L31.6 34.7C29.7 36 27 36.5 24 36.5C18.2 36.5 13.8 33.4 12.2 28.5L5.5 33.7C8.2 40.6 15.5 45 24 45Z" fill="#FBBC05"/>
              <path d="M12.2 28.5C11.8 27.4 11.5 26.3 11.5 24C11.5 21.7 11.8 20.6 12.2 19.5L5.5 14.7C4 17.6 3 20.7 3 24C3 27.3 4 30.4 5.5 33.3L12.2 28.5Z" fill="#EA4335"/>
            </svg>
          </span>
          Continue with Google
        </button>
      </form>

      <div class="auth-footer">
        <span>Already have an account?</span>
        <a routerLink="/auth/login">Sign in</a>
      </div>
    </div>
  </div>
</div>
