<nz-layout class="app-layout">
  <nz-sider [nzWidth]="208" class="sidebar">
    <div class="sidebar-logo">
      <span class="logo-text" aria-label="FitTrack">FitTrack<span class="logo-dot">.</span></span>
    </div>
    <ul nz-menu nzMode="inline" class="sidebar-menu">
      <li nz-menu-item routerLinkActive="ant-menu-item-selected">
        <a routerLink="/dashboard" aria-label="Dashboard">
          <span nz-icon nzType="ft:home"></span><span>Home</span>
        </a>
      </li>
      <li nz-menu-item routerLinkActive="ant-menu-item-selected">
        <a routerLink="/workouts" aria-label="Workouts">
          <span nz-icon nzType="ft:history"></span><span>History</span>
        </a>
      </li>
      <li nz-menu-item routerLinkActive="ant-menu-item-selected">
        <a routerLink="/start-workout" aria-label="Start workout">
          <span nz-icon nzType="ft:workout"></span><span>Workout</span>
        </a>
      </li>
      <li nz-menu-item routerLinkActive="ant-menu-item-selected">
        <a routerLink="/running" aria-label="Running">
          <span nz-icon nzType="ft:run"></span><span>Run</span>
        </a>
      </li>
      <li nz-menu-item routerLinkActive="ant-menu-item-selected">
        <a routerLink="/bmi" aria-label="Nutrition calculator">
          <span nz-icon nzType="ft:nutrition"></span>
          <span>Nutrition</span>
        </a>
      </li>
      <li nz-menu-item routerLinkActive="ant-menu-item-selected" class="sidebar-secondary-item">
        <a routerLink="/profile" aria-label="Profile">
          <span nz-icon nzType="idcard"></span><span>Profile</span>
        </a>
      </li>
      <li nz-menu-item routerLinkActive="ant-menu-item-selected" class="sidebar-secondary-item">
        <a routerLink="/account" aria-label="Account">
          <span nz-icon nzType="user"></span><span>Account</span>
        </a>
      </li>
      <li nz-menu-item routerLinkActive="ant-menu-item-selected" class="sidebar-secondary-item">
        <a routerLink="/settings" aria-label="Settings">
          <span nz-icon nzType="setting"></span><span>Settings</span>
        </a>
      </li>
      <li nz-menu-item class="sidebar-logout-item" (click)="logout()">
        <a aria-label="Logout">
          <span>Logout</span>
        </a>
      </li>
    </ul>
  </nz-sider>

  <nz-layout class="main-layout">
    <nz-header class="app-header">
      <div class="header-left">
        <app-menu></app-menu>
        <h2>
          <span class="desktop-page-title">Profile</span>
          <span class="mobile-header-brand">FitTrack<span class="brand-dot">.</span></span>
        </h2>
      </div>
    </nz-header>

    <nz-content class="app-content">
      <div class="profile-wrap">

        <!-- Personal profile -->
        <section class="profile-hero">
          <div class="avatar-wrap">
            <span class="profile-avatar">
              <img *ngIf="avatar()" [src]="avatar()" alt="Profile photo" />
              <ng-container *ngIf="!avatar()">{{ initials(displayName() || email()) }}</ng-container>
            </span>
            <label class="avatar-edit" [class.busy]="uploading()" aria-label="Change profile photo">
              <span nz-icon [nzType]="uploading() ? 'loading' : 'camera'"></span>
              <input type="file" accept="image/*" aria-label="Change profile photo" [disabled]="uploading()" (change)="onAvatarSelected($event)" />
            </label>
          </div>

          <h1>{{ displayName() || 'Athlete' }}</h1>
          <p class="profile-email">{{ email() }}</p>

          <button type="button" class="avatar-remove" *ngIf="avatar()" (click)="removeAvatar()">
            Remove photo
          </button>

          <a class="profile-account-link" routerLink="/account">Edit account details</a>
        </section>

      </div>
    </nz-content>
  </nz-layout>
</nz-layout>
