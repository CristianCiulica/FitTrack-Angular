<nz-modal
  [nzVisible]="visible"
  [nzTitle]="title"
  (nzOnCancel)="onCancel()"
  (nzOnOk)="submit()"
  nzOkText="Save"
  nzCancelText="Cancel"
  nzWidth="min(800px, calc(100vw - 24px))"
  [nzBodyStyle]="{ 'max-height': '70vh', overflow: 'auto' }"
>
  <ng-container *nzModalContent>
    <form nz-form [formGroup]="form" nzLayout="vertical">

      <!-- Workout name -->
      <nz-form-item>
        <nz-form-label nzRequired>Workout name</nz-form-label>
        <nz-form-control nzErrorTip="Please enter a valid name">
          <input nz-input formControlName="name" />
        </nz-form-control>
      </nz-form-item>

      <div class="exercises-header">
        <h3>Exercises</h3>
        <button nz-button nzType="dashed" type="button" (click)="addExercise()">
          <span nz-icon nzType="plus"></span> Add
        </button>
      </div>
      <hr class="exercises-divider" />

      <div formArrayName="exercises" class="exercises-list">
        <div *ngFor="let ex of exercises.controls; let i = index" [formGroupName]="i" class="exercise-row">
          <div class="ex-index">{{ i + 1 }}.</div>

          <nz-form-item class="flex-2 compact-item">
            <nz-form-control nzErrorTip="Required.">
              <input nz-input formControlName="exerciseName" placeholder="Exercise" />
            </nz-form-control>
          </nz-form-item>

          <nz-form-item class="flex-1 compact-item">
            <nz-form-control nzErrorTip="Required.">
              <nz-select formControlName="muscleGroup" nzPlaceHolder="Group">
                <nz-option *ngFor="let m of muscleGroups" [nzValue]="m" [nzLabel]="m"></nz-option>
              </nz-select>
            </nz-form-control>
          </nz-form-item>

          <nz-form-item class="compact-item field-compact field-small">
            <span class="mobile-field-label">Sets</span>
            <nz-form-control>
              <nz-input-number formControlName="sets" [nzMin]="1" [nzStep]="1" nzPlaceHolder="Set" style="width:100%"></nz-input-number>
            </nz-form-control>
          </nz-form-item>

          <nz-form-item class="compact-item field-compact field-small">
            <span class="mobile-field-label">Reps</span>
            <nz-form-control>
              <nz-input-number formControlName="reps" [nzMin]="1" [nzStep]="1" nzPlaceHolder="Rep" style="width:100%"></nz-input-number>
            </nz-form-control>
          </nz-form-item>

          <nz-form-item class="compact-item field-compact field-medium">
            <span class="mobile-field-label">Weight</span>
            <nz-form-control>
              <nz-input-number formControlName="weight" [nzMin]="0" [nzStep]="2.5" nzPlaceHolder="kg" style="width:100%"></nz-input-number>
            </nz-form-control>
          </nz-form-item>

          <button nz-button nzType="text" nzDanger type="button" (click)="removeExercise(i)" [disabled]="exercises.length === 1" class="remove-btn">
            <span nz-icon nzType="delete"></span>
          </button>
        </div>
      </div>
    </form>
  </ng-container>
</nz-modal>
