<nz-modal
  [nzVisible]="visible"
  [nzTitle]="title"
  [nzFooter]="null"
  nzWidth="520px"
  (nzOnCancel)="onCancel()">

  <ng-container *nzModalContent>
    <form nz-form [formGroup]="form" nzLayout="vertical" (ngSubmit)="submit()">

      <nz-form-item>
        <nz-form-label nzRequired>Exercițiu</nz-form-label>
        <nz-form-control nzErrorTip="Introduceți numele exercițiului (min. 2 caractere).">
          <input nz-input formControlName="exerciseName" placeholder="ex: Bench Press" />
        </nz-form-control>
      </nz-form-item>

      <nz-form-item>
        <nz-form-label nzRequired>Grupă musculară</nz-form-label>
        <nz-form-control nzErrorTip="Selectați grupa musculară.">
          <nz-select formControlName="muscleGroup" nzPlaceHolder="Selectează...">
            <nz-option *ngFor="let m of muscleGroups" [nzValue]="m" [nzLabel]="m"></nz-option>
          </nz-select>
        </nz-form-control>
      </nz-form-item>

      <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px">
        <nz-form-item>
          <nz-form-label nzRequired>Seturi</nz-form-label>
          <nz-form-control nzErrorTip="Min. 1">
            <nz-input-number formControlName="sets" [nzMin]="1" [nzMax]="20" style="width:100%"></nz-input-number>
          </nz-form-control>
        </nz-form-item>

        <nz-form-item>
          <nz-form-label nzRequired>Repetări</nz-form-label>
          <nz-form-control nzErrorTip="Min. 1">
            <nz-input-number formControlName="reps" [nzMin]="1" [nzMax]="100" style="width:100%"></nz-input-number>
          </nz-form-control>
        </nz-form-item>

        <nz-form-item>
          <nz-form-label nzRequired>Greutate (kg)</nz-form-label>
          <nz-form-control nzErrorTip="Min. 0">
            <nz-input-number formControlName="weight" [nzMin]="0" [nzMax]="500" [nzStep]="2.5" style="width:100%"></nz-input-number>
          </nz-form-control>
        </nz-form-item>
      </div>

      <nz-form-item>
        <nz-form-label nzRequired>Dată</nz-form-label>
        <nz-form-control nzErrorTip="Selectați data.">
          <input nz-input formControlName="date" type="date" />
        </nz-form-control>
      </nz-form-item>

      <nz-form-item>
        <nz-form-label>Note (opțional)</nz-form-label>
        <nz-form-control>
          <textarea nz-input formControlName="notes" [nzAutosize]="{ minRows: 2, maxRows: 4 }"
            placeholder="ex: Grip larg, pauze 90s..."></textarea>
        </nz-form-control>
      </nz-form-item>

      <div style="display:flex; justify-content:flex-end; gap:8px; margin-top:8px">
        <button nz-button type="button" (click)="onCancel()">Anulează</button>
        <button nz-button nzType="primary" type="submit">
          {{ isEdit ? 'Salvează' : 'Adaugă' }}
        </button>
      </div>

    </form>
  </ng-container>
</nz-modal>
