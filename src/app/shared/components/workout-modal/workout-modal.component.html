<nz-modal
  [nzVisible]="visible"
  [nzTitle]="titleTpl"
  [nzFooter]="footerTpl"
  (nzOnCancel)="onCancel()"
  nzWidth="min(720px, calc(100vw - 24px))"
  nzWrapClassName="workout-modal-wrap"
  [nzBodyStyle]="{ 'max-height': '68vh', overflow: 'auto', padding: '0' }"
>
  <ng-template #titleTpl>
    <div class="wm-title">
      <div class="wm-title-copy">
        <strong>{{ title }}</strong>
        <small>{{ subtitle }}</small>
      </div>
    </div>
  </ng-template>

  <ng-container *nzModalContent>
    <form [formGroup]="form" class="wm-form">
      <!-- Workout name -->
      <label class="wm-field">
        <span class="wm-field-label">Workout name</span>
        <input
          class="wm-input wm-input-hero"
          formControlName="name"
          placeholder="e.g. Upper body power"
          [class.is-invalid]="showError(form.get('name'))"
        />
        <small class="wm-error" *ngIf="showError(form.get('name'))">
          Give your workout a name (min. 2 characters).
        </small>
      </label>

      <!-- Exercises -->
      <div class="wm-section-head">
        <h3>Exercises</h3>
        <span class="wm-count">{{ exercises.length }}</span>
      </div>

      <div formArrayName="exercises" class="wm-exercises">
        <div
          class="wm-exercise"
          *ngFor="let ex of exercises.controls; let i = index"
          [formGroupName]="i"
        >
          <div class="wm-exercise-head">
            <span class="wm-exercise-num">{{ i + 1 }}</span>
            <input
              class="wm-input wm-exercise-name"
              formControlName="exerciseName"
              placeholder="Exercise name"
              [class.is-invalid]="showError(ex.get('exerciseName'))"
            />
            <button
              type="button"
              class="wm-remove"
              aria-label="Remove exercise"
              [disabled]="exercises.length === 1"
              (click)="removeExercise(i)"
            >
              <span nz-icon nzType="delete"></span>
            </button>
          </div>

          <label class="wm-subfield">
            <span class="wm-subfield-label">Muscle group</span>
            <select
              formControlName="muscleGroup"
              class="wm-select-native"
              [class.is-invalid]="showError(ex.get('muscleGroup'))"
            >
              <option value="null" disabled>Select a group</option>
              <option *ngFor="let m of muscleGroups" [value]="m">{{ m }}</option>
            </select>
          </label>

          <div class="wm-metrics">
            <label class="wm-subfield">
              <span class="wm-subfield-label">Sets</span>
              <nz-input-number formControlName="sets" [nzMin]="1" [nzStep]="1"></nz-input-number>
            </label>
            <label class="wm-subfield">
              <span class="wm-subfield-label">Reps</span>
              <nz-input-number formControlName="reps" [nzMin]="1" [nzStep]="1"></nz-input-number>
            </label>
          </div>
          <p class="wm-weight-hint">
            <span nz-icon nzType="bulb" nzTheme="outline"></span>
            You'll set the weight while training — we remember it for next time.
          </p>
        </div>
      </div>

      <button type="button" class="wm-add" (click)="addExercise()">
        <span nz-icon nzType="plus"></span>
        Add exercise
      </button>
    </form>
  </ng-container>

  <ng-template #footerTpl>
    <div class="wm-footer">
      <div class="wm-summary">
        <div>
          <strong>{{ filledExercises }}</strong>
          <span>exercises</span>
        </div>
        <div>
          <strong>{{ totalSets }}</strong>
          <span>sets</span>
        </div>
      </div>
      <div class="wm-actions">
        <button type="button" class="wm-btn wm-btn-ghost" (click)="onCancel()">Cancel</button>
        <button type="button" class="wm-btn wm-btn-primary" (click)="submit()">
          {{ isEdit ? 'Save changes' : 'Create workout' }}
        </button>
      </div>
    </div>
  </ng-template>
</nz-modal>
