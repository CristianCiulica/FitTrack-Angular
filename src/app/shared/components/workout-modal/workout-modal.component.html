<nz-modal
  [nzVisible]="visible"
  [nzTitle]="title"
  (nzOnCancel)="onCancel()"
  (nzOnOk)="submit()"
  nzOkText="Save"
  nzCancelText="Cancel"
  [nzWidth]="800"
>
  <ng-container *nzModalContent>
    <form nz-form [formGroup]="form" nzLayout="vertical">

      <!-- Workout name -->
      <nz-form-item>
        <nz-form-label nzRequired>Workout name</nz-form-label>
        <nz-form-control nzErrorTip="Please enter a valid name">
          <input nz-input formControlName="name" placeholder="e.g. Chest Day" />
        </nz-form-control>
      </nz-form-item>

      <div class="row-fields">
        <!-- Date -->
        <nz-form-item class="flex-1">
          <nz-form-label nzRequired>Date</nz-form-label>
          <nz-form-control>
            <input type="date" nz-input formControlName="date" />
          </nz-form-control>
        </nz-form-item>

        <!-- Notes -->
        <nz-form-item class="flex-2">
          <nz-form-label>Notes (optional)</nz-form-label>
          <nz-form-control>
            <input nz-input formControlName="notes" placeholder="e.g. Felt tired" />
          </nz-form-control>
        </nz-form-item>
      </div>

      <div class="exercises-header" style="display:flex; justify-content:space-between; margin-top:16px;">
        <h3 style="margin-bottom:0">Exercises</h3>
        <button nz-button nzType="dashed" (click)="addExercise()">
          <span nz-icon nzType="plus"></span> Add
        </button>
      </div>
      <hr style="margin: 8px 0 16px; border: none; border-top: 1px solid #eee;" />

      <div formArrayName="exercises" class="exercises-list">
        <div *ngFor="let ex of exercises.controls; let i = index" [formGroupName]="i" class="exercise-row" style="display: flex; gap: 8px; align-items: flex-end; margin-bottom: 8px;">
          <div class="ex-index" style="padding-bottom: 12px; font-weight: bold;">{{ i + 1 }}.</div>

          <nz-form-item class="flex-2" style="margin-bottom: 0;">
            <nz-form-control nzErrorTip="Required.">
              <input nz-input formControlName="exerciseName" placeholder="Exercise" />
            </nz-form-control>
          </nz-form-item>

          <nz-form-item class="flex-1" style="margin-bottom: 0;">
            <nz-form-control nzErrorTip="Required.">
              <nz-select formControlName="muscleGroup" nzPlaceHolder="Group">
                <nz-option *ngFor="let m of muscleGroups" [nzValue]="m" [nzLabel]="m"></nz-option>
              </nz-select>
            </nz-form-control>
          </nz-form-item>

          <nz-form-item style="margin-bottom: 0; width: 70px;">
            <nz-form-control>
              <nz-input-number formControlName="sets" [nzMin]="1" [nzStep]="1" nzPlaceHolder="Set" style="width:100%"></nz-input-number>
            </nz-form-control>
          </nz-form-item>

          <nz-form-item style="margin-bottom: 0; width: 70px;">
            <nz-form-control>
              <nz-input-number formControlName="reps" [nzMin]="1" [nzStep]="1" nzPlaceHolder="Rep" style="width:100%"></nz-input-number>
            </nz-form-control>
          </nz-form-item>

          <nz-form-item style="margin-bottom: 0; width: 80px;">
            <nz-form-control>
              <nz-input-number formControlName="weight" [nzMin]="0" [nzStep]="2.5" nzPlaceHolder="kg" style="width:100%"></nz-input-number>
            </nz-form-control>
          </nz-form-item>

          <button nz-button nzType="text" nzDanger (click)="removeExercise(i)" [disabled]="exercises.length === 1" style="margin-bottom: 4px;">
            <span nz-icon nzType="delete"></span>
          </button>
        </div>
      </div>
    </form>
  </ng-container>
</nz-modal>
