<button type="button" class="hamburger" aria-label="Open menu" (click)="toggle()">
  <span></span>
  <span></span>
  <span></span>
</button>

<nz-drawer
  [nzVisible]="open()"
  nzPlacement="left"
  [nzClosable]="false"
  [nzWidth]="308"
  nzWrapClassName="app-menu-drawer"
  (nzOnClose)="close()"
>
  <ng-container *nzDrawerContent>
    <div class="menu-panel">
      <div class="menu-brand">
        <span class="brand">FitTrack<span>.</span></span>
        <button type="button" class="close-btn" aria-label="Close menu" (click)="close()">
          <span nz-icon nzType="close"></span>
        </button>
      </div>

      <!-- Cardul de profil: identitatea ta din comunitate, tap -> /profile -->
      <button type="button" class="menu-hero" (click)="go('/profile')">
        <span class="hero-avatar">
          <img *ngIf="avatar()" [src]="avatar()" alt="" />
          <ng-container *ngIf="!avatar()">{{ initials() }}</ng-container>
        </span>
        <strong class="hero-name">{{ displayName() || 'Your profile' }}</strong>
        <small class="hero-email">{{ profile()?.email }}</small>
        <span class="hero-cta-pill">View profile <span aria-hidden="true">›</span></span>
      </button>

      <span class="menu-section-label">Manage</span>
      <nav class="menu-links">
        <button type="button" *ngFor="let link of links" class="menu-link" (click)="go(link.path)">
          <span class="link-icon" nz-icon [nzType]="link.icon"></span>
          <span class="link-copy">
            <strong>{{ link.label }}</strong>
            <small>{{ link.description }}</small>
          </span>
          <span class="link-arrow" aria-hidden="true">›</span>
        </button>
      </nav>

      <button type="button" class="logout-link" (click)="logout()">
        Log out
      </button>
    </div>
  </ng-container>
</nz-drawer>
